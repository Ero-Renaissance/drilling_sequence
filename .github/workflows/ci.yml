name: CI

# Backstop for the local pre-push hook (.githooks/pre-push): a clean-room run of
# the same checks, so a push that was made with --no-verify (or that only breaks
# in a fresh environment) still gets caught. On a pull request it runs before the
# merge, on every push to the PR branch; a small fix pushed straight to main gets
# it after the push — a tripwire there, not a gate; the hook is the gate.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The checks only read the repo; PR code must not run with a write token.
permissions:
  contents: read

# A new push to a PR cancels that PR's in-flight run. Every other run (a push to
# main, a manual dispatch) gets a group of its own, so none is queued or cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend · typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test

  backend:
    name: Backend · tests (in-memory sqlite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: System ODBC headers (for the pyodbc dependency)
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev
      - run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - run: python -m pytest -q

  # The tests above install the editable pyproject, NOT requirements.txt — so a
  # lockfile that Dependabot (or a hand edit) desyncs from the pinned deps would
  # pass tests yet break the Docker build. This job is the missing gate: a
  # clean-room install of requirements.txt on the Docker base Python (3.11),
  # which fails on any resolution conflict (e.g. pydantic vs its hard-pinned
  # pydantic-core). Docker installs the same file via uv; a plain-pip resolve is
  # enough to catch the conflict class without adding a third-party action.
  backend-lockfile:
    name: Backend · requirements.txt installs (Docker parity)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: System ODBC headers (for the pyodbc dependency)
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev
      - name: requirements.txt resolves and installs cleanly
        run: |
          python -m venv /tmp/lockcheck
          /tmp/lockcheck/bin/pip install --upgrade pip
          /tmp/lockcheck/bin/pip install -r requirements.txt

  # The jobs above run on SQLite, but production is SQL Server, and some bugs
  # only exist there: SQLAlchemy renders no lock for FOR UPDATE on SQL Server,
  # and migrations that build the schema on SQL Server never run on SQLite. This
  # job builds the schema from the migrations on a real SQL Server, checks it
  # matches the models, and runs the SQL Server-only tests.
  #
  # Pinned to the image local dev runs (2022 CU25; tag and digest, so it can't
  # drift) and to ubuntu-24.04, because the ODBC driver comes from Microsoft's
  # per-release apt repo. SQL Server Developer edition: licensed for dev/test, and
  # the SA password below is a throwaway for this job's private container, not a
  # secret.
  backend-mssql:
    name: Backend · SQL Server (migrations + concurrency tests)
    runs-on: ubuntu-24.04
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-CU25-ubuntu-22.04@sha256:e07b9699a2b749969f19d86563ceeea22bd3a69f7f1db85a8d1ac4bdaf0c6f56
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: CiThrowaway2026Pw
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P CiThrowaway2026Pw -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 20s
    env:
      DATABASE_URL: mssql+aioodbc://sa:CiThrowaway2026Pw@localhost:1433/drilling_sequence?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Microsoft ODBC Driver 18 (same apt source as backend/Dockerfile)
        run: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
            | sudo gpg --dearmor --yes -o /usr/share/keyrings/microsoft-prod.gpg
          curl -fsSL https://packages.microsoft.com/config/ubuntu/24.04/prod.list \
            | sudo tee /etc/apt/sources.list.d/microsoft-prod.list > /dev/null
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y --no-install-recommends msodbcsql18 unixodbc-dev
      - name: Create the database
        run: >-
          docker exec ${{ job.services.mssql.id }}
          /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P CiThrowaway2026Pw -b
          -Q "CREATE DATABASE drilling_sequence"
      - run: pip install -e ".[dev]"
      - name: Migrations build the schema (alembic upgrade head)
        run: alembic upgrade head
      # The suite builds its schema from the models; production builds it from
      # the migrations. This fails if the two disagree on SQL Server.
      - name: Models match the migrated schema (alembic check)
        run: alembic check
      # -p no:skipping: here these tests must run, so a broken DATABASE_URL fails
      # the job instead of quietly skipping the module. After the concurrency
      # tests, migration 038's data steps round-trip (downgrade to 037, seed,
      # upgrade, downgrade, back to head), then migration 039's (seed check,
      # downgrade to 038, an admin re-retires a check it retired, upgrade back
      # to head) on this throwaway database.
      - name: SQL Server concurrency + migration tests
        run: >-
          python -m pytest -q -p no:skipping
          tests/test_concurrency_mssql.py
          tests/test_migration_038_mssql.py
          tests/test_migration_039_mssql.py
